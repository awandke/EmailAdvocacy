<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Find Your Legislators</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #1f2937;
      background: #fff;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 680px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { margin: 0 0 20px; color: #4b5563; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #9ca3af;
      border-radius: 6px;
      font: inherit;
    }
    button {
      margin-top: 12px;
      padding: 11px 18px;
      border: 0;
      border-radius: 6px;
      color: white;
      background: #1d4ed8;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }
    button:disabled { cursor: wait; opacity: .65; }
    #status { margin-top: 18px; color: #4b5563; }
    #results div { padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    #results div:last-child { border-bottom: 0; }
    .error { color: #b91c1c !important; }
  </style>
</head>
<body>
  <main>
    <h1>Find Your Legislators</h1>
    <p class="intro">Enter your home address to find your state legislators.</p>
    <form id="lookup-form">
      <label for="address">Home address</label>
      <input id="address" autocomplete="street-address" placeholder="123 Main St, City, State ZIP" required />
      <input id="level" type="hidden" value="state" />
      <button type="submit">Search</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <section id="results"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
